# Generated by Gemini
name: Build Custom WSL2 Kernel for Waydroid

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 浅克隆加快速度

    - name: Check Runner Specs
      run: |
        echo "=== CPU 信息 ==="
        lscpu
        echo "=== 内存信息 ==="
        free -h
        echo "=== 磁盘空间 ==="
        df -h

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio bc libncurses-dev

    - name: Configure Kernel for Waydroid
      run: |
        # 复制 WSL 默认配置
        cp Microsoft/config-wsl .config
        
        # 注入 Android/Waydroid 必需的模块支持
        ./scripts/config --file .config \
          --enable CONFIG_ANDROID \
          --enable CONFIG_ASHMEM \
          --enable CONFIG_ANDROID_BINDER_IPC \
          --enable CONFIG_ANDROID_BINDERFS \
          --set-str CONFIG_ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder" \
          --enable CONFIG_STAGING \
          --enable CONFIG_BRIDGE \
          --enable CONFIG_VETH \
          --enable CONFIG_MACVLAN \
          --enable CONFIG_DUMMY \
          --enable CONFIG_TUN \
          --enable CONFIG_NF_NAT \
          --enable CONFIG_IP_NF_NAT \
          --enable CONFIG_IP_NF_TARGET_MASQUERADE \
          --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
          --enable CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
          --enable CONFIG_IP_NF_IPTABLES \
          --enable CONFIG_IP_NF_FILTER
          
        # 自动解决配置依赖
        make olddefconfig

    - name: Build Kernel
      run: |
        # 使用所有可用的 CPU 核心进行编译
        make -j$(nproc)

    - name: Upload bzImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bzImage-waydroid # 下载时的压缩包名称
        path: arch/x86/boot/bzImage
